<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مستكشف الدلالات والأنماط الصرفية القرآنية | MASAQ Semantic Graph</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="title">مستكشف المعاني والأنماط الصرفية</h1>
      <span class="badge">MASAQ Corpus Graph</span>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        data-i18n-placeholder="searchPlaceholder"
        placeholder="ابحث عن جذر أو معنى (مثال: رحم، علم، صبر، نور، قلب)..."
        autocomplete="off"
      />
      <button id="searchBtn" data-i18n="searchBtn">استكشاف</button>
    </div>

    <div class="header-controls">
      <div class="quick-tags">
        <span data-i18n="examples">أمثلة:</span>
        <button class="chip" data-q="رحم">رحم</button>
        <button class="chip" data-q="علم">علم</button>
        <button class="chip" data-q="صبر">صبر</button>
        <button class="chip" data-q="نور">نور</button>
        <button class="chip" data-q="حق">حق</button>
      </div>

      <div class="lang-switcher" role="group" aria-label="Language Switcher">
        <button class="lang-btn active" data-lang="ar">العربية</button>
        <button class="lang-btn" data-lang="tr">Türkçe</button>
        <button class="lang-btn" data-lang="en">English</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <!-- Filter Controls + Matched Surahs Column List -->
    <aside class="sidebar-right">
      <div class="panel-section">
        <h3 data-i18n="filtersTitle">تصفية النتائج (Filters)</h3>
        <div class="filter-column">
          <div class="filter-item">
            <label for="morphFilter" data-i18n="morphLabel">الوسم الصرفي (Morph_Tag):</label>
            <select id="morphFilter">
              <option value="ALL" data-i18n="allTags">الكل (All Tags)</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="phrasalFilter" data-i18n="phrasalLabel">الوظيفة التركيبية (Phrasal_Function):</label>
            <select id="phrasalFilter">
              <option value="ALL" data-i18n="allFunctions">الكل (All Functions)</option>
            </select>
          </div>

          <label class="toggle-label">
            <input type="checkbox" id="cooccurToggle" />
            <span data-i18n="cooccurLabel">إظهار روابط التقارب المعجمي (أقوى 3 روابط للسورة)</span>
          </label>

          <button id="resetFiltersBtn" class="secondary-btn" data-i18n="resetBtn">إعادة ضبط المرشحات</button>
        </div>
      </div>

      <hr class="divider" />

      <div class="panel-section surah-list-section">
        <div class="list-header">
          <h3 data-i18n="surahListTitle">قائمة السور المطابقة</h3>
          <span id="surahCountBadge" class="count-pill">0</span>
        </div>
        <div id="surahColumnList" class="surah-column-list"></div>
      </div>
    </aside>

    <!-- Center Column: Graph Canvas -->
    <section class="graph-container">
      <div id="cy"></div>
      <div class="zoom-controls">
        <button id="zoomInBtn" data-i18n-title="zoomIn" title="تكبير">+</button>
        <button id="zoomOutBtn" data-i18n-title="zoomOut" title="تصغير">−</button>
        <button id="fitGraphBtn" data-i18n-title="fitGraph" title="احتواء الشبكة">⊡</button>
      </div>
      <div class="graph-legend">
        <span><i class="dot concept"></i> <span data-i18n="legendConcept">الجذر / المعنى</span></span>
        <span><i class="dot surah"></i> <span data-i18n="legendSurah">السورة</span></span>
        <span><i class="dot verse"></i> <span data-i18n="legendVerse">الآية</span></span>
        <span><i class="line cooccur"></i> <span data-i18n="legendCooccur">تقارب معجمي</span></span>
      </div>
      <div id="statusOverlay" class="status-overlay" data-i18n="loading">جاري تحميل بيانات MASAQ...</div>
    </section>

    <!-- Corpus Statistics + Verse Context Inspector -->
    <aside class="inspector" id="inspector">
      <div class="stats-panel" id="corpusStatsPanel">
        <h3 data-i18n="statsTitle">التوزيع الصرفي والنحوي في المدونة</h3>
        <div id="corpusStatsContent" class="stats-grid"></div>
      </div>

      <hr class="divider" />

      <h2 data-i18n="inspectorTitle">تفاصيل الآيات والسياق</h2>
      <p class="hint" id="inspectorHint" data-i18n="inspectorHint">اختر <strong>سورة</strong> من القائمة أو من الشبكة لعرض جميع آياتها وسياقها.</p>
      <div id="inspectorContent"></div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
